name: Setup or playback feedback
description: Tell us how filo works with your Mac and DAC.
body:
  - type: markdown
    attributes:
      value: |
        Please describe your setup and experience; no music files or device serial numbers are needed.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Works with my setup
        - Installation or permissions
        - Playback or format matching
        - Interface feedback
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: macOS version, Mac chip, filo version, player, and DAC model.
      placeholder: macOS 26, Apple Silicon, filo 1.1.2, Apple Music, Sony NW-ZX706
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: What worked, what did not, and how we can reproduce it if something went wrong.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Use ••• → Connection details → Copy diagnostics. Review the text before posting it publicly.
      render: text
