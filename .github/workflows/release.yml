name: Verify release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Download the public release assets without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          for asset in filo-macos-universal.dmg filo-macos-universal.zip SHA256SUMS; do
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset" \
              --output "dist/$asset"
          done
      - name: Verify published signatures, notarization, version, and payloads
        run: python3 scripts/verify-release.py --require-notarization --tag "$RELEASE_TAG"
