name: macOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test policies and PCM
        run: swift test
      - name: Compile finite-reference laboratory without hardware
        run: bash scripts/verify-finite-reference.sh --check
      - name: Package and verify DMG and ZIP
        run: bash scripts/package-release.sh
